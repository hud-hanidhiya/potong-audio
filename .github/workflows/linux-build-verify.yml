name: Verifikasi Linux (Fase 0 PoC)

# Tujuan workflow ini: menutup item PoC yang masih "BELUM TERVERIFIKASI"
# di POC_FINDINGS.md — spesifik item #2 (sidecar FFmpeg di Linux x86_64),
# #3 bagian Linux (FFprobe), dan #6 (perbandingan ukuran build FFmpeg,
# minimal item pertama: konfirmasi ukuran actual di Linux untuk pembanding
# dengan hasil Windows). Jangan tutup PoC Fase 0 sebagai "selesai penuh"
# sebelum workflow ini hijau minimal sekali.
#
# Dipicu manual dulu (workflow_dispatch) sampai hasilnya stabil — baru
# tambahkan trigger otomatis (push/PR) kalau sudah percaya diri workflow
# ini tidak flaky.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/linux-build-verify.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"

env:
  # Dipilih 22.04, BUKAN ubuntu-latest, karena Tauri v2 dokumentasi resmi
  # merekomendasikan build di base system TERTUA yang mau di-support —
  # glibc yang di-link saat build jadi batas minimum versi OS user nanti.
  # (lihat: v2.tauri.app/distribute/debian — Ubuntu 22.04 sudah menyediakan
  # libwebkit2gtk-4.1-dev dari repo standar, tidak perlu PPA tambahan.)
  RUNNER_OS_LABEL: ubuntu-22.04

  # ⚠️ PIN VERSI FFmpeg — sengaja disamakan dengan build yang SUDAH
  # diverifikasi jalan di Windows (lihat POC_FINDINGS.md item #1):
  # "ffmpeg version N-126217-ge1e325235e-20260819". Ini supaya hasil
  # verifikasi Linux benar-benar sebanding (apple-to-apple), bukan
  # kebetulan lolos karena versi FFmpeg berbeda.
  #
  # Kalau di masa depan sengaja upgrade versi FFmpeg, update TAG ini DAN
  # jalankan ulang PoC Windows juga supaya kedua OS tetap pakai versi sama.
  FFMPEG_RELEASE_TAG: autobuild-2026-08-19-19-21
  FFMPEG_ASSET_NAME: ffmpeg-N-126217-ge1e325235e-linux64-gpl.tar.xz

jobs:
  verify-linux-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # -----------------------------------------------------------------
      # 1. Checkout & toolchain dasar
      # -----------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKitGTK 4.1 utk Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            # NOTE: sengaja TIDAK memasang libayatana-appindicator3-dev — package
            # itu hanya dibutuhkan oleh fitur system tray (tray-icon) Tauri, yang
            # tidak dipakai di Potong-Audio (tauri = { features = [] } -> tray-icon
            # mati, tidak ada kode tray di src-tauri/src). Kalau suatu saat fitur
            # system tray diaktifkan, package ini WAJIB dikembalikan atau build
            # Linux gagal link ke libappindicator3.
            libssl-dev \
            librsvg2-dev \
            pkg-config \
            xvfb

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # -----------------------------------------------------------------
      # 2. Test backend Rust CEPAT dulu (tanpa Tauri) — gagal di sini
      #    berarti masalah logika murni, bukan masalah integrasi Tauri/OS,
      #    jadi lebih murah didiagnosis sebelum lanjut ke build penuh.
      # -----------------------------------------------------------------
      - name: cargo test (default features, tanpa Tauri)
        working-directory: src-tauri
        run: cargo test --verbose

      # -----------------------------------------------------------------
      # 3. Download binary FFmpeg/FFprobe Linux — versi DIPIN, lihat
      #    catatan FFMPEG_RELEASE_TAG di atas.
      # -----------------------------------------------------------------
      - name: Download & verifikasi FFmpeg (linux64-gpl, versi dipin)
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE_TAG}"

          echo "Downloading: ${BASE_URL}/${FFMPEG_ASSET_NAME}"
          # Di-download pakai NAMA ASLI (FFMPEG_ASSET_NAME), BUKAN nama pendek,
          # supaya `sha256sum -c` di bawah bisa menemukan file yang namanya
          # tercantum di dalam baris checksums.sha256 (format: "<hash>  <nama>").
          curl -fL --retry 3 -o "${FFMPEG_ASSET_NAME}" "${BASE_URL}/${FFMPEG_ASSET_NAME}"

          # BtbN menerbitkan checksums.sha256 per release (terverifikasi ada
          # di rilis mereka) — download dan verifikasi asset kita terhadap
          # itu, bukan cuma print-dan-percaya (TOFU).
          echo "Downloading checksums.sha256 untuk verifikasi..."
          curl -fL --retry 3 -o checksums.sha256 "${BASE_URL}/checksums.sha256"

          EXPECTED_LINE=$(grep "${FFMPEG_ASSET_NAME}" checksums.sha256 || true)
          if [ -z "$EXPECTED_LINE" ]; then
            echo "PERINGATAN: nama asset tidak ditemukan di checksums.sha256 rilis ini."
            echo "Kemungkinan format file checksum berubah — JANGAN lanjutkan build"
            echo "tanpa verifikasi manual. sha256 hasil download (untuk dibandingkan manual):"
            sha256sum "${FFMPEG_ASSET_NAME}"
            exit 1
          fi

          echo "$EXPECTED_LINE" | sha256sum -c -
          echo "Checksum FFmpeg terverifikasi cocok dengan checksums.sha256 rilis."

          mkdir -p ffmpeg-extracted
          tar -xf "${FFMPEG_ASSET_NAME}" -C ffmpeg-extracted --strip-components=1

          mkdir -p src-tauri/binaries
          cp ffmpeg-extracted/bin/ffmpeg src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp ffmpeg-extracted/bin/ffprobe src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu

      - name: Sanity check — binary FFmpeg/FFprobe jalan di runner ini
        # Test paling dasar: apakah binary yang di-download bahkan bisa
        # dieksekusi di glibc/kernel runner ini (independen dari Tauri sama
        # sekali). Kalau step ini gagal, masalahnya di kompatibilitas
        # binary, BUKAN di kode aplikasi — penting dipisah biar diagnosis
        # tidak salah arah.
        run: |
          set -euo pipefail
          ./src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu -version
          ./src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu -version

          echo "--- Ukuran binary (untuk POC_FINDINGS.md item #6, kolom Linux) ---"
          du -h src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          du -h src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu

      # -----------------------------------------------------------------
      # 4. Build frontend
      # -----------------------------------------------------------------
      - name: npm ci
        run: npm ci

      - name: npm run build (tsc --noEmit + vite build)
        run: npm run build

      # -----------------------------------------------------------------
      # 5. Build aplikasi Tauri penuh untuk Linux
      # -----------------------------------------------------------------
      - name: Build Tauri app (AppImage + deb)
        run: npx tauri build --features tauri-runtime
        env:
          # Kalau nanti nambah code signing/notarization Linux (jarang,
          # tapi beberapa distro store butuh), env var relevan ditaruh di
          # sini sebagai secrets — belum ada untuk sekarang (lihat
          # POC_FINDINGS.md item #7, code signing ditunda ke Fase 5).
          CI: true

      - name: Cari & catat ukuran artefak hasil build
        run: |
          set -euo pipefail
          echo "--- File AppImage ---"
          find src-tauri/target/release/bundle -iname "*.AppImage" -exec ls -lh {} \;
          echo "--- File .deb ---"
          find src-tauri/target/release/bundle -iname "*.deb" -exec ls -lh {} \;

      # -----------------------------------------------------------------
      # 6. Smoke test — jalankan AppImage headless via Xvfb, pastikan
      #    proses tidak langsung crash. Ini BUKAN test fungsional penuh
      #    (tidak ada interaksi UI otomatis di sini) — cuma memastikan
      #    runtime Tauri + WebKitGTK + binary tidak segera mati sendiri,
      #    setara dengan smoke test manual yang sudah dilakukan di Windows
      #    (lihat POC_FINDINGS.md item #1).
      # -----------------------------------------------------------------
      - name: Smoke test — AppImage tidak crash saat startup
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle -iname "*.AppImage" | head -n1)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage tidak ditemukan — build dianggap gagal."
            exit 1
          fi
          chmod +x "$APPIMAGE"

          xvfb-run --auto-servernum -- "$APPIMAGE" --appimage-extract-and-run &
          APP_PID=$!

          sleep 5

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "OK: aplikasi masih berjalan setelah 5 detik (tidak crash langsung)."
            kill "$APP_PID" || true
          else
            echo "GAGAL: proses aplikasi sudah mati sebelum 5 detik — kemungkinan crash saat startup."
            exit 1
          fi

      # -----------------------------------------------------------------
      # 7. Upload artefak untuk inspeksi manual
      # -----------------------------------------------------------------
      - name: Upload AppImage & deb sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: potong-audio-linux-x86_64
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          retention-days: 14
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # SETELAH WORKFLOW INI HIJAU PERTAMA KALI, WAJIB DILAKUKAN MANUAL:
  # 1. Update POC_FINDINGS.md:
  #    - Item #2 & #3 → ganti "BELUM TERVERIFIKASI" jadi "YA" + link ke
  #      run workflow ini sebagai bukti.
  #    - Item #6 → isi kolom ukuran Linux (ffmpeg/ffprobe/AppImage/deb)
  #      dari log step "Cari & catat ukuran artefak" untuk melengkapi
  #      perbandingan full vs minimal build yang masih tertunda.
  # 2. Kalau FFMPEG_RELEASE_TAG akan di-upgrade suatu saat: update JUGA versi
  #    yang dipakai di build Windows (lihat POC_FINDINGS.md item #1) supaya
  #    kedua OS tetap pakai build FFmpeg yang identik.
  # -----------------------------------------------------------------------
